name: Resolve T1 security dependencies

on:
  push:
    branches:
      - feature/t1-connection-sidecar-integration-20261107
    paths:
      - ".github/workflows/resolve-t1-dependencies.yml"

permissions:
  contents: write

jobs:
  resolve:
    name: Cargo resolver security updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/t1-connection-sidecar-integration-20261107
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve patched transitive versions with Cargo
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p quinn-proto --precise 0.11.18
          cargo update -p rustls --precise 0.23.46
          cargo update -p rustls-webpki --precise 0.103.16
          cargo update -p webpki-root-certs --precise 1.0.10
          cargo update -p webpki-roots --precise 1.0.10
          cargo update -p tokio --precise 1.53.3
          cargo update -p chacha20 --precise 0.10.2

      - name: Verify selected lockfile versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          expected = {
              "quinn-proto": "0.11.18",
              "rustls": "0.23.46",
              "rustls-webpki": "0.103.16",
              "webpki-root-certs": "1.0.10",
              "webpki-roots": "1.0.10",
              "tokio": "1.53.3",
              "chacha20": "0.10.2",
          }
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          packages = lock["package"]
          errors = []
          for name, version in expected.items():
              found = sorted({p["version"] for p in packages if p["name"] == name})
              print(f"{name}: {found}")
              if version not in found:
                  errors.append(f"{name}: expected {version}, found {found}")
          if errors:
              raise SystemExit("\n".join(errors))
          PY
          git diff --check
          git diff --stat -- Cargo.lock
          git diff -- Cargo.lock

      - name: Commit Cargo-generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock unchanged; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "security: update vulnerable Rust dependencies"
          git push origin HEAD:feature/t1-connection-sidecar-integration-20261107
