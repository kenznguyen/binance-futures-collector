name: Resolve Vite 6 security upgrade

on:
  push:
    branches:
      - feature/t1-connection-sidecar-integration-20261107
    paths:
      - .github/workflows/resolve-vite6.yml

permissions:
  contents: write

jobs:
  resolve-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Upgrade Vite within supported major 6
        run: |
          npm install --save-dev 'vite@^6.4.5' --package-lock-only --ignore-scripts --no-audit
          node -e "const p=require('./package.json'); if(p.devDependencies.vite !== '^6.4.5') process.exit(1)"

      - name: Clean install
        run: npm ci

      - name: Full dependency audit
        run: |
          npm audit --json > audit.json || audit_status=$?
          node -e "const a=require('./audit.json'); console.log(JSON.stringify(a.metadata.vulnerabilities)); if(a.metadata.vulnerabilities.total !== 0) process.exit(1)"
          rm -f audit.json

      - name: TypeScript and production build
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Commit manifest and lockfile; remove temporary resolver
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/resolve-vite6.yml
          git add dashboard/frontend/package.json dashboard/frontend/package-lock.json
          git diff --cached --check
          git commit -m "security: upgrade Vite to patched 6.4.5"
          git push origin "HEAD:${GITHUB_REF_NAME}"
