name: CI

on:
  push:
    branches: [main, feature/t1-connection-sidecar-integration-20261107]
  workflow_dispatch:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  collector:
    name: collector · fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --all

      - name: NR-01 isolated Publisher/API filesystem non-regression
        shell: bash
        run: |
          set -euo pipefail

          sandbox="$(mktemp -d "${RUNNER_TEMP}/nr01-sandbox.XXXXXX")"
          sentinel="$(mktemp -d "${RUNNER_TEMP}/nr01-sentinel.XXXXXX")"
          cleanup() {
            rm -rf "$sandbox" "$sentinel"
          }
          trap cleanup EXIT

          assert_no_output_trees() {
            local root="$1"
            local found=0
            for relative_path in data/futures data/gaps; do
              if [[ -e "$root/$relative_path" ]]; then
                echo "NR01_FORBIDDEN_PATH_PRESENT=$root/$relative_path"
                found=1
              fi
            done
            if (( found != 0 )); then
              return 1
            fi
            echo "NR01_OUTPUT_TREES_ABSENT root=$root paths=data/futures,data/gaps"
          }

          # Prove the assertion detects each prohibited relative output tree.
          mkdir -p "$sentinel/data/futures"
          if assert_no_output_trees "$sentinel"; then
            echo "NR01_SENTINEL_FAILURE=data/futures was not detected"
            exit 1
          else
            echo "NR01_SENTINEL_DETECTED=data/futures"
          fi
          rm -rf "$sentinel/data"
          mkdir -p "$sentinel/data/gaps"
          if assert_no_output_trees "$sentinel"; then
            echo "NR01_SENTINEL_FAILURE=data/gaps was not detected"
            exit 1
          else
            echo "NR01_SENTINEL_DETECTED=data/gaps"
          fi
          rm -rf "$sentinel/data"

          test -z "$(find "$sandbox" -mindepth 1 -print -quit)"
          echo "NR01_SANDBOX=$sandbox"
          echo "NR01_SANDBOX_INITIAL_STATE=EMPTY"

          cargo test --no-run --locked \
            --bin binance-futures-collector \
            --test orderbook_v1_p3_contract

          mapfile -t publisher_bins < <(
            find target/debug/deps -maxdepth 1 -type f -executable \
              -name 'binance_futures_collector-*' -print
          )
          mapfile -t contract_bins < <(
            find target/debug/deps -maxdepth 1 -type f -executable \
              -name 'orderbook_v1_p3_contract-*' -print
          )

          if (( ${#publisher_bins[@]} != 1 )); then
            printf 'NR01_PUBLISHER_BINARY_COUNT=%s\n' "${#publisher_bins[@]}"
            printf '%s\n' "${publisher_bins[@]}"
            exit 1
          fi
          if (( ${#contract_bins[@]} != 1 )); then
            printf 'NR01_CONTRACT_BINARY_COUNT=%s\n' "${#contract_bins[@]}"
            printf '%s\n' "${contract_bins[@]}"
            exit 1
          fi

          publisher_bin="$(realpath "${publisher_bins[0]}")"
          contract_bin="$(realpath "${contract_bins[0]}")"
          publisher_tests="$("$publisher_bin" --list | grep -E '^orderbook_http::tests::' || true)"
          if [[ -z "$publisher_tests" ]]; then
            echo "NR01_PUBLISHER_HTTP_TEST_DISCOVERY=ZERO_MATCHES"
            exit 1
          fi
          echo "NR01_PUBLISHER_HTTP_TEST_COUNT=$(printf '%s\n' "$publisher_tests" | wc -l)"
          echo "NR01_PUBLISHER_HTTP_BINARY=$publisher_bin"
          echo "NR01_CONTRACT_BINARY=$contract_bin"

          test -z "$(find "$sandbox" -mindepth 1 -print -quit)"
          set +e
          (cd "$sandbox" && "$publisher_bin" 'orderbook_http::tests::' --test-threads=1)
          publisher_status=$?
          set -e
          assert_no_output_trees "$sandbox"
          if (( publisher_status != 0 )); then
            echo "NR01_PUBLISHER_HTTP_TEST_EXIT=$publisher_status"
            exit "$publisher_status"
          fi
          echo "NR01_PUBLISHER_HTTP_TEST=PASS"

          test -z "$(find "$sandbox" -mindepth 1 -print -quit)"
          set +e
          (cd "$sandbox" && "$contract_bin" --test-threads=1)
          contract_status=$?
          set -e
          assert_no_output_trees "$sandbox"
          if (( contract_status != 0 )); then
            echo "NR01_CONTRACT_TEST_EXIT=$contract_status"
            exit "$contract_status"
          fi
          echo "NR01_CONTRACT_TEST=PASS"
          echo "NR01_VERDICT=PASS"

      - name: Sidecar writer format
        run: cargo fmt --manifest-path crates/connection-sidecar/Cargo.toml --all -- --check

      - name: Sidecar writer Clippy
        run: cargo clippy --manifest-path crates/connection-sidecar/Cargo.toml --all-targets -- -D warnings

      - name: Sidecar writer offline tests
        run: cargo test --manifest-path crates/connection-sidecar/Cargo.toml --all-targets

      - name: Prepare standalone Linux Collector artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          test "$(uname -m)" = "x86_64"
          cd target/release
          sha256sum binance-futures-collector > SHA256SUMS

      - name: Upload standalone Linux Collector artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: t1-collector-linux-x86_64-${{ github.sha }}
          path: |
            target/release/binance-futures-collector
            target/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7


  collector-arm64:
    name: collector · native ARM64 build · test · artifact
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Assert native ARM64 runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          rustc -vV | grep -F "host: aarch64-unknown-linux-gnu"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build standalone ARM64 Collector
        run: cargo build --release --locked

      - name: Test
        run: cargo test --all

      - name: Sidecar writer offline tests
        run: cargo test --manifest-path crates/connection-sidecar/Cargo.toml --all-targets

      - name: Verify ARM64 ELF and prepare checksums
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          binary=target/release/binance-futures-collector
          test -x "$binary"
          file "$binary" | tee target/release/ELF-IDENTITY.txt
          readelf -h "$binary" | grep -F "Machine:                           AArch64"
          cd target/release
          sha256sum binance-futures-collector > SHA256SUMS

      - name: Upload standalone Linux ARM64 Collector artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: t1-collector-linux-aarch64-${{ github.sha }}
          path: |
            target/release/binance-futures-collector
            target/release/SHA256SUMS
            target/release/ELF-IDENTITY.txt
          if-no-files-found: error
          retention-days: 7

  dashboard-backend:
    name: dashboard backend · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/backend/requirements*.txt

      - name: Install
        run: pip install -r dashboard/backend/requirements.txt -r dashboard/backend/requirements-dev.txt

      - name: Test
        run: python -m pytest dashboard/backend/tests -q

  dashboard-frontend:
    name: dashboard frontend · tsc · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: docker · build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capture the exact floating Rust builder image toolchain before Compose
      # builds the Dockerfile that uses the same local image tag.
      - name: Diagnose Rust builder image toolchain
        run: |
          set -euo pipefail
          docker pull rust:1-slim-bookworm
          docker image inspect rust:1-slim-bookworm --format 'RUST_BUILDER_IMAGE_ID={{.Id}}'
          # Use a non-login shell so the image-provided PATH (including
          # /usr/local/cargo/bin) is preserved for rustc and cargo.
          docker run --rm rust:1-slim-bookworm sh -c '
            set -eu
            printf "BUILDER_PATH=%s\\n" "$PATH"
            command -v rustc
            command -v cargo
            rustc --version --verbose
            cargo --version --verbose
          '

      # Re-run the exact Docker build command without --locked in isolated copies,
      # then capture the Cargo.lock delta. This identifies the lockfile entry Cargo
      # wants to change without modifying repository inputs.
      - name: Diagnose Cargo lockfile delta
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # Docker runs as root in the mounted probe directory. Restore runner ownership before cleanup.
          trap 'sudo chown -R "$(id -u):$(id -g)" "$tmp" 2>/dev/null || true; rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/full" "$tmp/docker-context"
          tar -C "$GITHUB_WORKSPACE" --exclude=.git --exclude=target -cf - . | tar -C "$tmp/full" -xf -
          cp Cargo.toml Cargo.lock "$tmp/docker-context/"
          cp -a .cargo src "$tmp/docker-context/"

          probe() {
            local label="$1" dir="$2" status
            cp "$dir/Cargo.lock" "$dir/Cargo.lock.before"
            set +e
            docker run --rm -v "$dir:/repro" -w /repro rust:1-slim-bookworm \
              sh -c 'apt-get update >/dev/null && apt-get install -y --no-install-recommends make >/dev/null && cargo build --release'
            status=$?
            set -e
            echo "CARGO_BUILD_UNLOCKED_PROBE[$label]=$status"
            if [[ -f "$dir/Cargo.lock" ]]; then
              if cmp -s "$dir/Cargo.lock.before" "$dir/Cargo.lock"; then
                echo "CARGO_LOCK_DELTA[$label]=NONE"
              else
                echo "CARGO_LOCK_DELTA[$label]=PRESENT"
                diff -u "$dir/Cargo.lock.before" "$dir/Cargo.lock" || true
              fi
            fi
            printf -v "${label}_status" '%s' "$status"
          }
          probe FULL_CONTEXT "$tmp/full"
          probe DOCKER_COPY_CONTEXT "$tmp/docker-context"
          echo "LOCKFILE_DELTA_PROBE=COMPLETE"
      
      # Builds both images exactly as `docker compose up --build` would, so the
      # advertised one-command install path is actually exercised in CI (the
      # native build job runs on a fat runner and can't catch a missing image
      # dependency like jemalloc's make).
      - name: Build images (collector + dashboard)
        run: docker compose build

  security:
    name: security · cargo-audit · npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependency feature reachability diagnostics
        shell: bash
        run: |
          set -u
          classify_tree_output() {
            local output="$1"
            local package_nodes
            if grep -qE 'warning: nothing to print' <<<"$output"; then
              echo "NO_PATH_EMITTED"
              return
            fi
            package_nodes="$(grep -Ec '^[[:space:]│├└─`-]*[[:alnum:]_.+-]+ v[0-9]+\.' <<<"$output" || true)"
            if [[ "$package_nodes" =~ ^[0-9]+$ ]] && (( package_nodes >= 2 )); then
              echo "PATH_FOUND"
            else
              echo "NO_PATH_EMITTED"
            fi
          }
          tree_fixture=$'quinn-proto v0.11.16\n└── quinn v0.11.11\n    └── reqwest v0.13.1'
          empty_fixture='warning: nothing to print'
          download_noise_fixture=$'Downloaded quinn-proto v0.11.16'
          if [[ "$(classify_tree_output "$tree_fixture")" != "PATH_FOUND" ]]; then
            echo "classifier fixture failed: populated reverse tree"
            exit 1
          fi
          if [[ "$(classify_tree_output "$empty_fixture")" != "NO_PATH_EMITTED" ]]; then
            echo "classifier fixture failed: Cargo nothing-to-print output"
            exit 1
          fi
          if [[ "$(classify_tree_output "")" != "NO_PATH_EMITTED" ]]; then
            echo "classifier fixture failed: empty output"
            exit 1
          fi
          if [[ "$(classify_tree_output "$download_noise_fixture")" != "NO_PATH_EMITTED" ]]; then
            echo "classifier fixture failed: registry download chatter"
            exit 1
          fi
          echo "DIAGNOSTIC_CLASSIFIER_FIXTURES=4/4_PASS"
          packages=(
            quinn-proto@0.11.18
            quinn-udp@0.5.15
            rustix@1.1.4
            rustls@0.23.46
            rustls-webpki@0.103.16
            webpki-root-certs@1.0.10
            webpki-roots@1.0.10
            tokio@1.53.3
            chacha20@0.10.2
          )
          for package in "${packages[@]}"; do
            echo "::group::cargo tree default-feature reverse path: $package"
            if output="$(cargo tree --locked --color never -e features -i "$package" 2>&1)"; then
              printf '%s\n' "$output"
              classification="$(classify_tree_output "$output")"
              echo "DEFAULT_FEATURE_REACHABILITY[$package]=$classification"
            else
              status=$?
              printf '%s\n' "$output"
              echo "DEFAULT_FEATURE_REACHABILITY[$package]=COMMAND_ERROR (exit $status)"
            fi
            echo "::endgroup::"
          done
      - name: All-features/all-targets exact package reachability diagnostics
        shell: bash
        run: |
          set -u
          classify_tree_output() {
            local output="$1"
            local package_nodes
            if grep -qE 'warning: nothing to print' <<<"$output"; then
              echo "NO_PATH_EMITTED"
              return
            fi
            package_nodes="$(grep -Ec '^[[:space:]│├└─`-]*[[:alnum:]_.+-]+ v[0-9]+\.' <<<"$output" || true)"
            if [[ "$package_nodes" =~ ^[0-9]+$ ]] && (( package_nodes >= 2 )); then
              echo "PATH_FOUND"
            else
              echo "NO_PATH_EMITTED"
            fi
          }
          packages=(
            quinn-proto@0.11.18
            quinn-udp@0.5.15
            rustix@1.1.4
            rustls@0.23.46
            rustls-webpki@0.103.16
            webpki-root-certs@1.0.10
            webpki-roots@1.0.10
            tokio@1.53.3
            chacha20@0.10.2
          )
          for package in "${packages[@]}"; do
            echo "::group::cargo tree all-target reverse path: $package"
            if output="$(cargo tree --locked --color never --all-features --all-targets -e features -i "$package" 2>&1)"; then
              printf '%s\n' "$output"
              classification="$(classify_tree_output "$output")"
              echo "ALL_FEATURES_ALL_TARGETS_PACKAGE_REACHABILITY[$package]=$classification"
            else
              status=$?
              printf '%s\n' "$output"
              echo "ALL_FEATURES_ALL_TARGETS_PACKAGE_REACHABILITY[$package]=COMMAND_ERROR (exit $status)"
            fi
            echo "::endgroup::"
          done
      - name: cargo-audit (Rust advisories)
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - name: npm audit (production dependencies, high severity)
        working-directory: dashboard/frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (dev dependencies, informational)
        working-directory: dashboard/frontend
        continue-on-error: true
        run: npm audit --audit-level=high
