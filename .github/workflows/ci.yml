name: CI

on:
  push:
    branches: [main, feature/t1-connection-sidecar-integration-20261107]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  collector:
    name: collector · fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --all

      - name: Sidecar writer format
        run: cargo fmt --manifest-path crates/connection-sidecar/Cargo.toml --all -- --check

      - name: Sidecar writer Clippy
        run: cargo clippy --manifest-path crates/connection-sidecar/Cargo.toml --all-targets -- -D warnings

      - name: Sidecar writer offline tests
        run: cargo test --manifest-path crates/connection-sidecar/Cargo.toml --all-targets

  dashboard-backend:
    name: dashboard backend · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/backend/requirements*.txt

      - name: Install
        run: pip install -r dashboard/backend/requirements.txt -r dashboard/backend/requirements-dev.txt

      - name: Test
        run: python -m pytest dashboard/backend/tests -q

  dashboard-frontend:
    name: dashboard frontend · tsc · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: docker · build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds both images exactly as `docker compose up --build` would, so the
      # advertised one-command install path is actually exercised in CI (the
      # native build job runs on a fat runner and can't catch a missing image
      # dependency like jemalloc's make).
      - name: Build images (collector + dashboard)
        run: docker compose build

  security:
    name: security · cargo-audit · npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Dependency feature reachability diagnostics
        shell: bash
        run: |
          set -u

          # A successful cargo-tree exit is not sufficient: Cargo may print
          # "warning: nothing to print" with exit code 0 for an inactive package.
          classify_tree_output() {
            local output="$1"
            local package_nodes
            if grep -qE 'warning: nothing to print' <<<"$output"; then
              echo "NO_PATH_EMITTED"
              return
            fi
            package_nodes="$(grep -Ec '(^|[[:space:]├└│`-])[[:alnum:]_.+-]+ v[0-9]+\.' <<<"$output" || true)"
            if [[ "$package_nodes" =~ ^[0-9]+$ ]] && (( package_nodes >= 2 )); then
              echo "PATH_FOUND"
            else
              echo "NO_PATH_EMITTED"
            fi
          }

          # Exercise the classifier against a real reverse tree, Cargo's
          # successful-but-empty diagnostic, and empty output before using it.
          tree_fixture=$'quinn-proto v0.11.16\n└── quinn v0.11.11\n    └── reqwest v0.13.1'
          empty_fixture='warning: nothing to print'
          if [[ "$(classify_tree_output "$tree_fixture")" != "PATH_FOUND" ]]; then
            echo "classifier fixture failed: populated reverse tree"
            exit 1
          fi
          if [[ "$(classify_tree_output "$empty_fixture")" != "NO_PATH_EMITTED" ]]; then
            echo "classifier fixture failed: Cargo nothing-to-print output"
            exit 1
          fi
          if [[ "$(classify_tree_output "")" != "NO_PATH_EMITTED" ]]; then
            echo "classifier fixture failed: empty output"
            exit 1
          fi
          echo "DIAGNOSTIC_CLASSIFIER_FIXTURES=3/3_PASS"

          for crate in quinn-proto rustls rustls-webpki webpki-root-certs webpki-roots tokio chacha20; do
            echo "::group::cargo tree default-feature reverse path: $crate"
            if output="$(cargo tree --locked -e features -i "$crate" 2>&1)"; then
              printf '%s\n' "$output"
              classification="$(classify_tree_output "$output")"
              echo "DEFAULT_FEATURE_REACHABILITY[$crate]=$classification"
            else
              status=$?
              printf '%s\n' "$output"
              echo "DEFAULT_FEATURE_REACHABILITY[$crate]=COMMAND_ERROR (exit $status)"
            fi
            echo "::endgroup::"
          done

      - name: All-target exact package reachability diagnostics
        shell: bash
        run: |
          set -u

          classify_tree_output() {
            local output="$1"
            local package_nodes
            if grep -qE 'warning: nothing to print' <<<"$output"; then
              echo "NO_PATH_EMITTED"
              return
            fi
            package_nodes="$(grep -Ec '(^|[[:space:]├└│`-])[[:alnum:]_.+-]+ v[0-9]+\.' <<<"$output" || true)"
            if [[ "$package_nodes" =~ ^[0-9]+$ ]] && (( package_nodes >= 2 )); then
              echo "PATH_FOUND"
            else
              echo "NO_PATH_EMITTED"
            fi
          }

          packages=(
            quinn-proto@0.11.16
            rustls@0.23.43
            rustls-webpki@0.103.14
            webpki-root-certs@1.0.9
            webpki-roots@1.0.9
            tokio@1.53.1
            chacha20@0.10.1
          )
          for package in "${packages[@]}"; do
            echo "::group::cargo tree all-target reverse path: $package"
            if output="$(cargo tree --locked --target all -i "$package" 2>&1)"; then
              printf '%s\n' "$output"
              classification="$(classify_tree_output "$output")"
              echo "ALL_TARGET_PACKAGE_REACHABILITY[$package]=$classification"
            else
              status=$?
              printf '%s\n' "$output"
              echo "ALL_TARGET_PACKAGE_REACHABILITY[$package]=COMMAND_ERROR (exit $status)"
            fi
            echo "::endgroup::"
          done

      - name: cargo-audit (Rust advisories)
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      # Gate on what actually ships. The dashboard image serves the *built* static
      # assets through FastAPI, so vite/esbuild and the rest of devDependencies are
      # build-time only and never reachable at runtime. Auditing them here would gate
      # the build on advisories that do not apply to the deployed artifact (the
      # standing example being the esbuild dev-server advisory, which needs a
      # breaking vite major to clear and affects `vite dev` alone).
      - name: npm audit (production dependencies, high severity)
        working-directory: dashboard/frontend
        run: npm audit --omit=dev --audit-level=high

      # Dev-dependency advisories are still worth seeing; they just do not fail CI.
      - name: npm audit (dev dependencies, informational)
        working-directory: dashboard/frontend
        continue-on-error: true
        run: npm audit --audit-level=high
