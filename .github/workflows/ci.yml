name: CI

on:
  push:
    branches: [main, feature/t1-connection-sidecar-integration-20261107]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  collector:
    name: collector · fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --all

      - name: Sidecar writer format
        run: cargo fmt --manifest-path crates/connection-sidecar/Cargo.toml --all -- --check

      - name: Sidecar writer Clippy
        run: cargo clippy --manifest-path crates/connection-sidecar/Cargo.toml --all-targets -- -D warnings

      - name: Sidecar writer offline tests
        run: cargo test --manifest-path crates/connection-sidecar/Cargo.toml --all-targets

  dashboard-backend:
    name: dashboard backend · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/backend/requirements*.txt

      - name: Install
        run: pip install -r dashboard/backend/requirements.txt -r dashboard/backend/requirements-dev.txt

      - name: Test
        run: python -m pytest dashboard/backend/tests -q

  dashboard-frontend:
    name: dashboard frontend · tsc · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: docker · build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds both images exactly as `docker compose up --build` would, so the
      # advertised one-command install path is actually exercised in CI (the
      # native build job runs on a fat runner and can't catch a missing image
      # dependency like jemalloc's make).
      - name: Build images (collector + dashboard)
        run: docker compose build

  security:
    name: security · cargo-audit · npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Dependency feature reachability diagnostics
        shell: bash
        run: |
          set -u
          for crate in quinn-proto rustls rustls-webpki webpki-root-certs webpki-roots tokio chacha20; do
            echo "::group::cargo tree feature paths: $crate"
            if output="$(cargo tree --locked -e features -i "$crate" 2>&1)"; then
              printf '%s\n' "$output"
              echo "REACHABILITY[$crate]=PRESENT_IN_DEFAULT_GRAPH"
            else
              status=$?
              printf '%s\n' "$output"
              echo "REACHABILITY[$crate]=NOT_IN_DEFAULT_GRAPH (exit $status)"
            fi
            echo "::endgroup::"
          done

      - name: All-target dependency feature reachability diagnostics
        shell: bash
        run: |
          set -u
          for crate in quinn-proto rustls rustls-webpki webpki-root-certs webpki-roots tokio chacha20; do
            echo "::group::cargo tree all-target feature paths: $crate"
            if output="$(cargo tree --locked --target all -e features -i "$crate" 2>&1)"; then
              printf '%s\n' "$output"
              echo "ALL_TARGET_REACHABILITY[$crate]=PRESENT"
            else
              status=$?
              printf '%s\n' "$output"
              echo "ALL_TARGET_REACHABILITY[$crate]=NOT_FOUND (exit $status)"
            fi
            echo "::endgroup::"
          done

      - name: cargo-audit (Rust advisories)
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      # Gate on what actually ships. The dashboard image serves the *built* static
      # assets through FastAPI, so vite/esbuild and the rest of devDependencies are
      # build-time only and never reachable at runtime. Auditing them here would gate
      # the build on advisories that do not apply to the deployed artifact (the
      # standing example being the esbuild dev-server advisory, which needs a
      # breaking vite major to clear and affects `vite dev` alone).
      - name: npm audit (production dependencies, high severity)
        working-directory: dashboard/frontend
        run: npm audit --omit=dev --audit-level=high

      # Dev-dependency advisories are still worth seeing; they just do not fail CI.
      - name: npm audit (dev dependencies, informational)
        working-directory: dashboard/frontend
        continue-on-error: true
        run: npm audit --audit-level=high
