name: Dependency Security Remediation (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_update:
        description: "Set to yes to resolve the approved Rust dependency advisories"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: dependency-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    name: Resolve, audit, test, and publish review artifacts
    if: github.ref == 'refs/heads/feature/t1-connection-sidecar-integration-20261107' && inputs.confirm_update == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact dispatched revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p remediation-evidence/reports
          cp Cargo.lock remediation-evidence/Cargo.lock.before
          printf 'repository=%s\nbranch=%s\nsource_sha=%s\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" "${GITHUB_SHA}" \
            > remediation-evidence/run-metadata.txt
          rustc -Vv >> remediation-evidence/run-metadata.txt
          cargo -V >> remediation-evidence/run-metadata.txt

      - name: Resolve patched Rust dependency versions
        id: resolve
        shell: bash
        run: |
          set +e
          cd "${GITHUB_WORKSPACE}"
          report="remediation-evidence/reports"
          overall=0
          run_check() {
            name="$1"
            shift
            echo "::group::$name"
            "$@" > "$report/$name.log" 2>&1
            rc=$?
            cat "$report/$name.log"
            echo "$name=$rc" | tee -a "$report/exit-codes.txt"
            if [ "$rc" -ne 0 ]; then overall=1; fi
            echo "::endgroup::"
          }
          run_check update-quinn-proto cargo update -p quinn-proto --precise 0.11.19
          run_check update-quinn-udp cargo update -p quinn-udp --precise 0.5.16
          run_check update-rustix cargo update -p rustix --precise 1.1.6
          echo "updates_ok=$((1-overall))" >> "$GITHUB_OUTPUT"
          echo "$overall" > "$report/update-status.txt"
          git diff -- Cargo.lock > remediation-evidence/Cargo.lock.patch
          cp Cargo.lock remediation-evidence/Cargo.lock.after
          exit 0

      - name: Verify dependency resolution and reverse paths
        if: always()
        shell: bash
        run: |
          set +e
          report="remediation-evidence/reports"
          for package in quinn-proto quinn-udp rustix; do
            cargo tree --locked --all-features --all-targets -e features -i "$package" \
              > "$report/tree-$package.log" 2>&1
            rc=$?
            echo "tree-$package=$rc" >> "$report/dependency-tree-status.txt"
          done
          git diff --stat > remediation-evidence/source-diff-stat.txt
          git status --short > remediation-evidence/git-status.txt
          git diff --name-only > remediation-evidence/changed-paths.txt
          if grep -Ev '^Cargo\.lock$' remediation-evidence/changed-paths.txt | grep -q .; then
            echo "Unexpected tracked-file change outside Cargo.lock" \
              | tee remediation-evidence/reports/scope-violation.txt
            echo "scope_violation=1" >> "$report/exit-codes.txt"
          else
            echo "scope_violation=0" >> "$report/exit-codes.txt"
          fi

      - name: Install cargo-audit
        if: always()
        shell: bash
        run: |
          set +e
          cargo install cargo-audit --locked \
            > remediation-evidence/reports/install-cargo-audit.log 2>&1
          rc=$?
          cat remediation-evidence/reports/install-cargo-audit.log
          echo "install-cargo-audit=$rc" >> remediation-evidence/reports/exit-codes.txt

      - name: Run Rust security audit
        if: always()
        shell: bash
        run: |
          set +e
          report="remediation-evidence/reports"
          cargo audit --json > "$report/cargo-audit.json" 2> "$report/cargo-audit.stderr"
          audit_rc=$?
          echo "cargo-audit=$audit_rc" >> "$report/exit-codes.txt"

          python3 - "$report/cargo-audit.json" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as report_file:
                  report = json.load(report_file)
              vulnerabilities = report["vulnerabilities"]
              found = vulnerabilities["found"]
              count = vulnerabilities["count"]
              entries = vulnerabilities["list"]
              warnings = report["warnings"]
              if not isinstance(found, bool):
                  raise ValueError("vulnerabilities.found must be a boolean")
              if not isinstance(count, int) or isinstance(count, bool) or count < 0:
                  raise ValueError("vulnerabilities.count must be a non-negative integer")
              if not isinstance(entries, list) or len(entries) != count:
                  raise ValueError("vulnerabilities.list does not match vulnerabilities.count")
              if found != (count > 0):
                  raise ValueError("vulnerabilities.found does not match vulnerabilities.count")
              if not isinstance(warnings, dict):
                  raise ValueError("warnings must be an object")
              warning_counts = {}
              for kind, items in warnings.items():
                  if not isinstance(items, list):
                      raise ValueError(f"warnings.{kind} must be an array")
                  warning_counts[kind] = len(items)
              print(f"Audit JSON complete: vulnerabilities_found={found}, vulnerability_count={count}")
              print("Warning counts: " + ", ".join(f"{kind}={amount}" for kind, amount in sorted(warning_counts.items())))
          except Exception as error:
              print(f"Audit report validation failed: {error}", file=sys.stderr)
              sys.exit(1)
          PY
          audit_validation_rc=$?
          echo "cargo-audit-report-validation=$audit_validation_rc" >> "$report/exit-codes.txt"

          if [ -s "$report/cargo-audit.stderr" ]; then
            cat "$report/cargo-audit.stderr"
          fi
          if [ "$audit_validation_rc" -ne 0 ]; then
            echo "Security audit report is missing, incomplete, or has an unexpected schema."
          fi

      - name: Format, lint, build, and test updated lockfile
        if: steps.resolve.outputs.updates_ok == '1'
        shell: bash
        run: |
          set +e
          report="remediation-evidence/reports"
          run_check() {
            name="$1"
            shift
            echo "::group::$name"
            "$@" > "$report/$name.log" 2>&1
            rc=$?
            cat "$report/$name.log"
            echo "$name=$rc" >> "$report/exit-codes.txt"
            echo "::endgroup::"
          }
          run_check cargo-fmt cargo fmt --all --check
          run_check cargo-clippy cargo clippy --all-targets --all-features -- -D warnings
          run_check cargo-build cargo build --release --locked
          run_check cargo-test cargo test --all --locked

      - name: Final scope and lockfile evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff -- Cargo.lock > remediation-evidence/Cargo.lock.patch
          cp Cargo.lock remediation-evidence/Cargo.lock.after
          git status --short > remediation-evidence/git-status-final.txt
          git diff --name-only > remediation-evidence/changed-paths-final.txt
          {
            printf '## Dependency remediation evidence\n\n'
            printf -- '- Source SHA: `%s`\n' "$GITHUB_SHA"
            printf -- '- Branch: `%s`\n' "$GITHUB_REF_NAME"
            if git diff --quiet -- Cargo.lock; then
              printf -- '- Lockfile changed: no\n'
            else
              printf -- '- Lockfile changed: yes\n'
            fi
            cat <<'EOF'
          - This workflow does not commit or push changes.
          - Review `Cargo.lock.patch`, reports, and exit codes before manually applying any change.
          EOF
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload remediation review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-dependency-remediation-${{ github.sha }}
          path: remediation-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce remediation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="remediation-evidence/reports/exit-codes.txt"
          test -f "$report"
          if awk -F= '$2 ~ /^[0-9]+$/ && $2 != 0 { found=1 } END { exit(found ? 0 : 1) }' "$report"; then
            echo "One or more remediation checks failed; inspect uploaded evidence."
            exit 1
          fi
          if ! grep -q '^cargo-audit-report-validation=0            echo "Scope violation detected."
            exit 1
          fi
          if [ ! -f remediation-evidence/Cargo.lock.patch ]; then
            echo "Cargo.lock patch evidence is missing."
            exit 1
          fi
 "$report"; then
            echo "A complete, validated cargo-audit JSON report is required."
            exit 1
          fi
          if grep -q 'scope_violation=1' "$report"; then
            echo "Scope violation detected."
            exit 1
          fi
          if [ ! -f remediation-evidence/Cargo.lock.patch ]; then
            echo "Cargo.lock patch evidence is missing."
            exit 1
          fi
